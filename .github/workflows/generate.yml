name: Generate Official Draft Order

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate official results (one-time)
        run: node scripts/generate_results.js

      - name: Commit results if changed
        run: |
          if git diff --quiet; then
            echo "No changes (already generated)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git commit -m "Generate official draft order (one-time)"
          git push
